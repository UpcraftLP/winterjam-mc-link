commands.whitelist.name=whitelist
commands.whitelist.description=Manage whitelisted users

commands.whitelist.add.name=add
commands.whitelist.add.description=Add your Minecraft account to the whitelist
commands.whitelist.add.response.success=Success!
commands.whitelist.add.response.already_whitelisted=That user is already whitelisted!
commands.whitelist.add.embed.title=Added to whitelist
commands.whitelist.add.embed.text={user} added [{minecraft_username}](https://mcuuid.net/?q={minecraft_uuid}) to the whitelist
commands.whitelist.add.embed.footer=UUID: {minecraft_uuid}

commands.whitelist.remove.name=remove
commands.whitelist.remove.description=Remove a user from the whitelist
commands.whitelist.remove.embed.title=Added to whitelist
commands.whitelist.remove.embed.text={user} added [{minecraft_username}](https://mcuuid.net/?q={minecraft_uuid}) to the whitelist
commands.whitelist.remove.embed.footer=UUID: {minecraft_uuid}

commands.whitelist.ban.name=ban
commands.whitelist.ban.description=Remove all Minecraft accounts of a user and prevent them from using the command again

arguments.minecraft_user.name=username
arguments.minecraft_user.description=Your Minecraft username or UUID
